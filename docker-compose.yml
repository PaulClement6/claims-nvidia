services:
  backend:
    build: ./backend
    environment:
      CLAIMS_DATA: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
