# Sandbox policy of one claim (issue #14). The backend renders it for each sandbox
# (`render_policy` in backend/app/agent/sandbox.py): it fills in the port, the path and
# the tool rules, each at the place marked with at signs below.
#
# Deny by default. The only ways out are:
#   - the MCP path of this claim on the backend (below): three MCP methods, and
#     `tools/call` for the tools of the graph, nothing else;
#   - the model endpoint, through the provider profile `claims-nim`
#     (infra/sandbox/profile-nim.yaml): POST /v1/chat/completions only.
# The backend serves nothing else to the sandbox: no other path of this host and
# port is allowed, and no other host. No `curl`, no shell tool in the image.
# Denied requests are in `openshell logs <sandbox> --source sandbox` (DENIED lines).
version: 1

filesystem_policy:
  include_workdir: true # /sandbox, the scratch folder (read-write): the checkpoints
  read_only:
    - /usr
    - /lib
    - /etc
    - /app
    - /proc
    - /sys
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  claims_gateway:
    name: claims tool gateway (MCP)
    endpoints:
      - host: host.openshell.internal
        port: @PORT@
        path: @PATH@
        protocol: mcp
        enforcement: enforce
        rules:
          - allow:
              method: initialize
          - allow:
              method: notifications/initialized
          - allow:
              method: tools/list
@TOOL_RULES@
    binaries:
      - path: /usr/local/bin/python3.12
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/python
