# Sandbox policy of the spike (issue #13). MCP_PORT is replaced by run-spike.sh.
# Deny by default: the only ways out are the MCP gateway (one tool) and, through the
# provider profile, the model endpoint.
version: 1

filesystem_policy:
  include_workdir: true   # /sandbox, the scratch folder (read-write)
  read_only:
    - /usr
    - /lib
    - /etc
    - /app
    - /proc
    - /sys
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  claims_gateway:
    name: claims tool gateway (MCP)
    endpoints:
      - host: host.openshell.internal
        port: MCP_PORT
        path: /mcp
        protocol: mcp
        enforcement: enforce
        rules:
          - allow:
              method: initialize
          - allow:
              method: notifications/initialized
          - allow:
              method: tools/list
          - allow:
              method: tools/call
              tool: get_customer_policies
    binaries:
      - path: /usr/local/bin/python3.12
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/python
      - path: /usr/bin/curl
