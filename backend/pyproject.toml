[project]
name = "claims-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx2>=2.16.0",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "reportlab>=5.1.0",
    "pillow>=13.0.0",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: calls the real model with NVIDIA_KEY; run with -m live"]
addopts = "-m 'not live'"
