[project]
name = "claims-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx2>=2.16.0",
    "langchain==1.5.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.21",
    "langgraph-checkpoint-sqlite==3.1.3",
    "mcp==1.30.0",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "reportlab>=5.1.0",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: calls the real model with NVIDIA_KEY; run with -m live",
    "sandbox: needs OpenShell, Colima and the image of infra/sandbox/setup.sh; run with -m sandbox",
]
addopts = "-m 'not live and not sandbox'"
